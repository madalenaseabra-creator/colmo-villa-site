name: Sync availability from Google Calendar
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: availability
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the calendar and write busy dates only
        env:
          ICAL_URL: ${{ secrets.ICAL_URL }}
          MIN_NIGHTS: "2"
        run: python3 .github/scripts/ical_busy.py
      - name: Commit if the dates changed
        run: |
          if [ -n "$(git status --porcelain v16/data)" ]; then
            git config user.name "availability-bot"
            git config user.email "availability-bot@users.noreply.github.com"
            git add v16/data/busy.json
            git commit -m "availability: update booked dates"
            git push
          fi
